[package]
name = "poracode-git-helper"
# helperVersion reported by the hello handshake. Bump on any behavior change so
# stale staged binaries are detectable (see .agents/docs/versioning.md).
version = "0.3.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
description = "Poracode native parallel Git status and worktree batch helper"

[lib]
name = "poracode_git_helper"
path = "src/lib.rs"

[[bin]]
name = "poracode-git-helper"
path = "src/main.rs"

[dependencies]
git2 = { version = "=0.21.0", default-features = false, features = ["vendored-libgit2"] }
gix-config = { version = "=0.62.1", default-features = false, features = ["sha1"] }
gix-glob = { version = "=0.29.1", default-features = false }
libgit2-sys = { version = "=0.18.8", default-features = false }
# Includes Windows OS-overflow rescan and watch shutdown fixes absent from 8.x.
notify = "=9.0.0-rc.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Unicode 17 matches Node 26 / ICU 78; 0.1.26 uses Unicode 18 tables.
unicode-normalization = "=0.1.25"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
