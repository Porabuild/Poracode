[package]
name = "poracode-git-helper"
# helperVersion reported by the hello handshake. Bump on any behavior change so
# stale staged binaries are detectable (see .agents/docs/versioning.md).
version = "0.2.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
description = "Poracode native parallel Git status and worktree batch helper"

[lib]
name = "poracode_git_helper"
path = "src/lib.rs"

[[bin]]
name = "poracode-git-helper"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
