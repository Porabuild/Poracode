<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poracode</title>
    <script>
      // The desktop renderer requires Electron's preload bridge (window.lightcode).
      // If this document is ever loaded in a plain browser — e.g. a phone that added
      // the dev server's "/" to its home screen — the bridge is absent and the
      // renderer cannot run (it would crash on a black screen). Redirect to the
      // installable mobile PWA instead. In Electron the bridge is present, so this
      // is a no-op. mobile.html is a distinct document, so there is no redirect loop.
      (function () {
        try {
          if (!("lightcode" in window)) {
            window.location.replace("/mobile.html" + window.location.search + window.location.hash);
          }
        } catch (e) {
          // Never let the guard itself break startup.
        }
      })();
    </script>
    <script>
      // Pre-paint theme bootstrap: apply the saved appearance + background before
      // the first frame so the initial paint matches the active theme instead of
      // flashing the hardcoded base palette. The renderer re-applies the full
      // token set on mount (see renderer/theme/applyAppTheme.ts).
      (function () {
        try {
          var root = document.documentElement;
          var boot = JSON.parse(localStorage.getItem("lightcode-boot") || "null");
          var appearance =
            boot && (boot.appearance === "light" || boot.appearance === "dark")
              ? boot.appearance
              : null;
          if (!appearance) {
            var settings = JSON.parse(localStorage.getItem("lightcode-shared-settings") || "null");
            var mode = settings && settings.themeMode;
            var prefersDark =
              !window.matchMedia || window.matchMedia("(prefers-color-scheme: dark)").matches;
            appearance =
              mode === "light"
                ? "light"
                : mode === "dark"
                  ? "dark"
                  : prefersDark
                    ? "dark"
                    : "light";
          }
          root.classList.remove("light", "dark");
          root.classList.add(appearance);
          root.dataset.theme = appearance;
          if (boot && boot.bg) root.style.backgroundColor = boot.bg;
        } catch (e) {
          // Ignore; the renderer applies real settings shortly after mount.
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
