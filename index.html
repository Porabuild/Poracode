<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <meta name="theme-color" content="#070709" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Poracode" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Poracode</title>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%app-icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <script>
      // Select only the responsive layout before first paint. This is a viewport
      // capability query, not phone or user-agent detection; the renderer keeps
      // the attribute synchronized when the window resizes or rotates.
      (function () {
        try {
          document.documentElement.toggleAttribute(
            "data-compact-layout",
            window.matchMedia("(max-width: 767px)").matches,
          );
          document.documentElement.toggleAttribute(
            "data-coarse-input",
            window.matchMedia("(hover: none), (pointer: coarse)").matches,
          );
          var standalone =
            window.navigator.standalone === true ||
            window.matchMedia("(display-mode: standalone)").matches ||
            window.matchMedia("(display-mode: fullscreen)").matches;
          var ios =
            /iPad|iPhone|iPod/i.test(window.navigator.userAgent || "") ||
            (window.navigator.platform === "MacIntel" && window.navigator.maxTouchPoints > 1);
          document.documentElement.toggleAttribute("data-pwa-standalone", standalone);
          document.documentElement.toggleAttribute("data-mobile-standalone", standalone);
          document.documentElement.dataset.clientHost = window.poracodeHost
            ? "electron"
            : "browser";
          if (standalone && ios) {
            document.documentElement.style.setProperty("height", "100lvh");
          }
        } catch (e) {
          // The canonical renderer will re-evaluate capabilities during boot.
        }
      })();
    </script>
    <script>
      console.log(`[renderer-bootstrap] page +${Math.round(performance.now())}ms index parsed`);
    </script>
    <script>
      // One-time namespace migration for renderer state copied from pre-rebrand
      // installs. Keep the old keys as a backup; current code writes Poracode keys.
      (function () {
        try {
          for (var i = 0; i < localStorage.length; i++) {
            var legacyKey = localStorage.key(i);
            if (!legacyKey || !legacyKey.startsWith("lightcode")) continue;
            var currentKey = "poracode" + legacyKey.slice("lightcode".length);
            if (localStorage.getItem(currentKey) !== null) continue;
            var value = localStorage.getItem(legacyKey);
            if (value !== null) localStorage.setItem(currentKey, value);
          }
        } catch (e) {
          // Storage can be unavailable; the app can still start with defaults.
        }
      })();
    </script>
    <script>
      // Pre-paint theme bootstrap: apply the saved appearance + background before
      // the first frame so the initial paint matches the active theme instead of
      // flashing the hardcoded base palette. The renderer re-applies the full
      // token set on mount (see renderer/theme/applyAppTheme.ts).
      (function () {
        try {
          var root = document.documentElement;
          var boot = JSON.parse(localStorage.getItem("poracode-boot") || "null");
          var appearance =
            boot && (boot.appearance === "light" || boot.appearance === "dark")
              ? boot.appearance
              : null;
          if (!appearance) {
            var settings = JSON.parse(localStorage.getItem("poracode-shared-settings") || "null");
            var mode = settings && settings.themeMode;
            var prefersDark =
              !window.matchMedia || window.matchMedia("(prefers-color-scheme: dark)").matches;
            appearance =
              mode === "light"
                ? "light"
                : mode === "dark"
                  ? "dark"
                  : prefersDark
                    ? "dark"
                    : "light";
          }
          root.classList.remove("light", "dark");
          root.classList.add(appearance);
          root.dataset.theme = appearance;
          if (boot && boot.bg) root.style.backgroundColor = boot.bg;
        } catch (e) {
          // Ignore; the renderer applies real settings shortly after mount.
        }
      })();
    </script>
    <script>
      // LAN remote access can serve the canonical desktop client over plain
      // HTTP, where randomUUID is unavailable despite getRandomValues working.
      // Run before renderer modules because IDs are created during evaluation.
      (function () {
        if (typeof crypto.randomUUID === "function") return;
        crypto.randomUUID = function () {
          var bytes = crypto.getRandomValues(new Uint8Array(16));
          bytes[6] = (bytes[6] & 0x0f) | 0x40;
          bytes[8] = (bytes[8] & 0x3f) | 0x80;
          var hex = "";
          for (var i = 0; i < 16; i++) hex += bytes[i].toString(16).padStart(2, "0");
          return (
            hex.slice(0, 8) +
            "-" +
            hex.slice(8, 12) +
            "-" +
            hex.slice(12, 16) +
            "-" +
            hex.slice(16, 20) +
            "-" +
            hex.slice(20)
          );
        };
      })();
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/renderer/bootstrap.ts"></script>
  </body>
</html>
