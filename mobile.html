<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <meta name="theme-color" content="#070709" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Poracode" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Poracode</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/app-icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: dark;
        background: #070709;
      }

      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #070709;
      }

      body {
        overflow: hidden;
      }

      .mobile-boot-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #070709;
        color: #f4f4f5;
        font:
          600 15px ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .mobile-boot-screen__wordmark {
        display: inline-flex;
        align-items: baseline;
        color: #eaf0fb;
        font-size: clamp(2.25rem, 14vw, 4rem);
        letter-spacing: -0.045em;
        line-height: 1;
      }

      .mobile-boot-screen__wordmark-strong {
        font-weight: 700;
      }

      .mobile-boot-screen__wordmark-code {
        font-weight: 600;
      }

      .mobile-boot-screen__wordmark-dot {
        width: 0.24em;
        height: 1em;
        margin: 0 0.03em 0 0.1em;
        overflow: visible;
        fill: #8b7bff;
        vertical-align: baseline;
      }
    </style>
    <script>
      (function () {
        try {
          var prefersDark =
            !window.matchMedia || window.matchMedia("(prefers-color-scheme: dark)").matches;
          var appearance = prefersDark ? "dark" : "light";
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(appearance);
          document.documentElement.dataset.theme = appearance;
        } catch (e) {
          document.documentElement.classList.add("dark");
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <script>
      // Served over plain http on a LAN address the page is not a secure
      // context, so crypto.randomUUID is missing while the shared renderer
      // code assumes it exists. Classic script: runs before all modules.
      (function () {
        if (typeof crypto.randomUUID === "function") return;
        crypto.randomUUID = function () {
          var bytes = crypto.getRandomValues(new Uint8Array(16));
          bytes[6] = (bytes[6] & 0x0f) | 0x40;
          bytes[8] = (bytes[8] & 0x3f) | 0x80;
          var hex = "";
          for (var i = 0; i < 16; i++) hex += bytes[i].toString(16).padStart(2, "0");
          return (
            hex.slice(0, 8) +
            "-" +
            hex.slice(8, 12) +
            "-" +
            hex.slice(12, 16) +
            "-" +
            hex.slice(16, 20) +
            "-" +
            hex.slice(20)
          );
        };
      })();
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root">
      <div class="mobile-boot-screen" aria-label="Loading Poracode">
        <div class="mobile-boot-screen__wordmark" aria-hidden="true">
          <span class="mobile-boot-screen__wordmark-strong">Pora</span>
          <svg class="mobile-boot-screen__wordmark-dot" viewBox="0 0 24 100" focusable="false">
            <circle cx="12" cy="96" r="9"></circle>
          </svg>
          <span class="mobile-boot-screen__wordmark-code">code</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/mobile/main.tsx"></script>
  </body>
</html>
