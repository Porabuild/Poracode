packages:
  - "."
  - "website"
  - "packages/agents-usage"

# Share the virtual store across worktrees/checkouts via symlinks instead of
# hardlinking every package into each node_modules/.pnpm (see pnpm.io/git-worktrees).
enableGlobalVirtualStore: true

allowBuilds:
  "@sentry/cli": true
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  node-pty: true
  onnxruntime-node: false
  protobufjs: false
  sharp: true
onlyBuiltDependencies:
  - "@sentry/cli"
  - better-sqlite3
  - electron
  - electron-winstaller
  - esbuild
  - node-pty

# @sentry/electron's main-process bundle eagerly requires @sentry/node, which
# requires @opentelemetry/* via bare paths. Under pnpm's nested layout
# electron-builder does not traverse those into the asar. Public-hoisting
# pins them to top-level node_modules so the default packaging traversal
# picks them up.
publicHoistPattern:
  - "@opentelemetry/*"
  - "@sentry/*"
  - "@sentry-internal/*"
  - "@fastify/otel"
  - "@prisma/instrumentation"
  - "import-in-the-middle"
  - "require-in-the-middle"
  - "acorn"
  - "acorn-import-attributes"
  - "cjs-module-lexer"
  - "module-details-from-path"

# Force electron-builder to traverse symlinked transitive deps under pnpm's
# nested layout. Without this, deep deps like @opentelemetry/* are not copied
# into the asar even when listed in `files`.
nodeLinker: hoisted

minimumReleaseAgeExclude:
  - electron@41.7.0
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.154"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.154"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.154"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.154"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.154"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.154"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.154"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.154"
  - "@anthropic-ai/claude-agent-sdk@0.3.154"
  # Already present in the lockfile when the supply-chain guard was added.
  - "react@19.2.7"
  - "react-dom@19.2.7"
  - "@types/react@19.2.16"
  - "lucide-react@1.17.0"

# Supply-chain guard: refuse to install any package version published less
# than this many minutes ago. 7 days catches the typical window in which
# malicious or compromised releases are detected and unpublished.
# Use `minimumReleaseAgeExclude` above to whitelist specific versions that
# need to be adopted immediately (e.g. security patches, first-party SDKs).
minimumReleaseAge: 10080

# Force-bump vulnerable transitive dependencies flagged by GitHub Dependabot.
# These selectors only rewrite versions that fall inside the advisory range,
# leaving already-patched copies (e.g. dompurify 3.4.5) untouched.
overrides:
  "axios@<1.16.0": "^1.16.0"
  "tmp@<0.2.6": "^0.2.6"
  "brace-expansion@>=5.0.0 <5.0.6": "^5.0.6"
  "dompurify@<3.3.2": "^3.3.2"
