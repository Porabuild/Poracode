# Supply-chain guard: refuse to install any package version published less
# than this many minutes ago. 7 days catches the typical window in which
# malicious or compromised releases are detected and unpublished.
# Use `minimumReleaseAgeExclude` above to whitelist specific versions that
# need to be adopted immediately (e.g. security patches, first-party SDKs).
minimumReleaseAge: 10080

# Force-bump vulnerable transitive dependencies flagged by GitHub Dependabot.
# Each selector is scoped to the affected major so it only rewrites versions
# inside the advisory range and never force-upgrades a different major line.
overrides:
  "axios@<1.16.0": "^1.16.0"
  "tmp@<0.2.6": "^0.2.6"
  "brace-expansion@>=5.0.0 <5.0.6": "^5.0.6"
  "esbuild@<0.28.1": "0.28.1"
  "shell-quote@<1.9.0": "^1.9.0"
  "cross-spawn@<6.0.6": "6.0.6"
  "@xmldom/xmldom@<0.8.13": "0.8.13"
  # DOMPurify custom-element hook bypass (#141).
  "dompurify@>=3.0.0 <3.4.12": "3.4.12"
  # 2026-06-15 advisory batch (alerts #88-#102).
  "@opentelemetry/core@>=2.0.0 <2.8.0": "2.8.0"
  "protobufjs@>=7.0.0 <7.6.5": "7.6.5"
  "form-data@>=4.0.0 <4.0.6": "4.0.6"
  "tar@>=7.0.0 <7.5.16": "^7.5.16"
  "vite@>=8.0.0 <8.0.16": "^8.0.16"
  "js-yaml@>=4.0.0 <4.2.0": "^4.2.0"
  "@babel/core@>=7.0.0 <7.29.6": "^7.29.6"
  # PostCSS source-map arbitrary file read (#153, #164).
  "postcss@<8.5.12": "8.5.12"
  "mermaid@>=11.0.0-alpha.1 <=11.14.0": "11.15.0"
  "joi@>=18.0.0 <18.2.1": "18.2.1"
  # 2026-06-18 advisory batch.
  "undici@>=6.0.0 <6.27.0": "6.27.0"
  "undici@>=7.0.0 <7.28.0": "7.28.0"
  # Hono request-context disclosure / JSX XSS / header de-duplication
  # (#138-#140), plus the node adapter's encoded-backslash traversal (#137).
  "hono@<4.12.27": "4.12.27"
  "@hono/node-server@<2.0.5": "2.0.5"
  # fast-uri host confusion through a backslash authority delimiter (#143).
  "fast-uri@>=3.0.0 <3.1.4": "3.1.4"
  # sharp 0.35.x upgrades libvips past the inherited CVE batch (#142, #154).
  # Use 0.35.3, which also restores exported TypeScript declarations.
  "sharp@<0.35.3": "0.35.3"
  # got UNIX-socket redirect (#103); only the dev react-devtools update-notifier
  # chain pulls the vulnerable 6.x. Pin to the last CJS line (11.x), since
  # package-json@4 `require()`s got and got@12+ is ESM-only.
  "got@<11.8.5": "11.8.6"
  # electron use-after-free / injection batch (#106-#123). The vulnerable 23.x
  # comes only from react-devtools (dev-only standalone inspector); 23.x has no
  # in-line patch (#104), so dedupe it onto the app's own electron major.
  "electron@>=23.0.0 <39.8.5": "43.1.0"
  # 2026-07-21 advisory batch (#132-#136).
  # adm-zip crafted-ZIP 4GB allocation; only used by onnxruntime-node's install
  # script to extract trusted NuGet archives.
  "adm-zip@<0.6.0": "^0.6.0"
  # brace-expansion exponential-time expansion DoS, 1.x/2.x lines.
  "brace-expansion@<1.1.16": "^1.1.16"
  "brace-expansion@>=2.0.0 <2.1.2": "^2.1.2"
