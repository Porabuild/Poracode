# The second preload lets the transcript run the desktop's presentation modules
# (src/desktop/bunPlugin.ts); compiled builds register the same plugin.
preload = ["@opentui/solid/preload", "./src/desktop/preload.ts"]

[test]
preload = ["@opentui/solid/preload", "./src/desktop/preload.ts"]

[install]
saveTextLockfile = true
# The vendored workspace packages resolve shared dependencies (solid-js and
# friends) from tui/node_modules, so pin the flat layout instead of inheriting
# the machine's default linker (CI and fresh machines default to isolated).
linker = "hoisted"
