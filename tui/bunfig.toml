preload = ["@opentui/solid/preload"]

[install]
saveTextLockfile = true
# Installs every @opentui/core-<platform>-<arch> variant so `bun run tui:build`
# can cross-compile from any runner; each binary still embeds only its own
# platform's native library via the resolver pin in scripts/build-tui.mjs.
supportedArchitectures = { os = [
  "win32",
  "darwin",
  "linux",
], cpu = [
  "x64",
  "arm64",
], libc = [
  "glibc",
  "musl",
] }
