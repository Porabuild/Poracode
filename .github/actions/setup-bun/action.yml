name: Setup pinned Bun
description: Install the exact npm Bun build used by the workspace
inputs:
  registry-cache:
    description: Package registry cache to restore (all, bun, or none)
    required: false
    default: "all"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: "26"
    - name: Read pinned Bun version
      id: bun-version
      shell: bash
      run: |
        node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./package.json').devDependencies.bun + '\n')"
    # Defender's real-time scan of every written file made Windows jobs several
    # times slower than Linux (npm installs and the cache restore below). On these
    # single-use hosted runners, exclude the workspace, temp folders and package
    # and toolchain caches; scanning stays on everywhere else.
    - name: Exclude build folders from Defender scanning (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $npmCache = (& npm config get cache).Trim()
        if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($npmCache)) {
          throw "Could not locate the npm download cache"
        }
        $paths = @(
          $env:GITHUB_WORKSPACE,
          $env:RUNNER_TEMP,
          $env:RUNNER_TOOL_CACHE,
          $env:TEMP,
          (Join-Path $env:LOCALAPPDATA 'Temp'),
          $npmCache,
          (Join-Path $env:LOCALAPPDATA 'electron'),
          (Join-Path $env:LOCALAPPDATA 'electron-builder'),
          (Join-Path $env:USERPROFILE '.bun'),
          (Join-Path $env:USERPROFILE '.cargo')
        ) | Where-Object { $_ }
        try {
          Add-MpPreference -ExclusionPath $paths -ErrorAction Stop
          Write-Host "Defender exclusions: $($paths -join ', ')"
        } catch {
          Write-Host "::warning::Could not add Defender exclusions: $($_.Exception.Message)"
        }
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/poracode-bun
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun-version.outputs.version }}
    - name: Install pinned Bun
      shell: bash
      run: node scripts/setup-bun.mjs
    - name: Locate package download caches
      id: registry-cache
      shell: bash
      run: |
        echo "bun=$(bun pm cache)" >> "$GITHUB_OUTPUT"
        echo "npm=$(npm config get cache)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      if: inputs.registry-cache == 'all'
      with:
        path: |
          ${{ steps.registry-cache.outputs.bun }}
          ${{ steps.registry-cache.outputs.npm }}
        key: registry-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'scripts/device-hub-runtime/package-lock.json') }}
        restore-keys: |
          registry-${{ runner.os }}-${{ runner.arch }}-
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      if: inputs.registry-cache == 'bun'
      with:
        path: ${{ steps.registry-cache.outputs.bun }}
        key: registry-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          registry-bun-${{ runner.os }}-${{ runner.arch }}-
