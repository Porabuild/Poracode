name: Release PWA

# Deploys the hosted PWA to Vercel production. Independent of the native
# mobile store releases (see release-mobile.yml). A manual dispatch can no
# longer publish an unqualified SHA: the qualify job requires successful CI and
# Native clients runs — including their required gates — at the exact SHA
# before the web job may publish (see scripts/qualify-release-pwa.mjs).

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-pwa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify the dispatch commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      qualified: ${{ steps.check.outputs.qualified }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      # The dispatch controller is trusted for the SHA; check out only that
      # commit for the qualification script itself.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Require successful core and native checks
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/qualify-release-pwa.mjs

  web:
    name: Web (Vercel)
    needs: qualify
    if: ${{ needs.qualify.outputs.qualified == 'true' }}
    runs-on: ubuntu-latest
    environment: mobile-web
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PORACODE_MOBILE_APP_HOST: ${{ vars.PORACODE_MOBILE_APP_HOST }}
      QUALIFIED_SHA: ${{ needs.qualify.outputs.sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.qualify.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Validate Vercel configuration
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing mobile-web variable: $name" >&2
              exit 1
            fi
          done
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Missing mobile-web secret: VERCEL_TOKEN" >&2
            exit 1
          fi
      - name: Install Vercel CLI
        run: npm install --global vercel@59.10.0
      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        env:
          PORACODE_MOBILE_ANDROID_SHA256_CERT_FINGERPRINTS: ${{ secrets.PORACODE_MOBILE_ANDROID_SHA256_CERT_FINGERPRINTS }}
          PORACODE_MOBILE_APPLE_TEAM_ID: ${{ secrets.PORACODE_MOBILE_APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Recheck after build/environment waits. Serialized publication plus
          # a current-head check prevents old queued runs rolling back prod.
          node scripts/qualify-release-pwa.mjs --require "$QUALIFIED_SHA"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
