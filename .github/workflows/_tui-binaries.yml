name: TUI binaries (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build from.
        required: true
        type: string

jobs:
  # bun build --compile cross-compiles: each target's compile downloads that
  # target's Bun runtime and embeds its @opentui/core-<platform-arch> native
  # library (`bun run tui:install` installs every OS and CPU variant), and
  # ad-hoc signs the darwin-arm64 binary on any host. Linux ships the glibc
  # build.
  #
  # Every desktop and server build blocks on the manifest this job uploads, so
  # all six targets build on one Linux runner. A per-OS matrix made the whole
  # release wait for a macOS runner (15 minutes when CI held the macOS slots)
  # and for the slowest Windows setup.
  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          registry-cache: bun
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile --ignore-scripts && node node_modules/bun/install.js
      - name: Install TUI workspace dependencies
        run: bun run tui:install
      # --require fails the job when any target fails to compile, so the
      # manifest — the sha256/size trust root staged inside the server tarball
      # and desktop CLI resources — always lists all six binaries.
      - name: Build TUI binaries and the manifest
        run: bun scripts/build-tui.mjs --require --manifest-out resources/tui/manifest.json
      - name: Upload TUI binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Only the binaries — a manifest.json here would land as a release
          # asset via the release job's flatten step.
          name: poracode-tui-binaries
          path: dist/tui/*/poracode-tui-*
          if-no-files-found: error
          # A rerun after a failed manifest upload must be able to replace the
          # binaries it stored; upload-artifact v4 otherwise rejects the name.
          overwrite: true
      # Uploaded last, without overwrite: the builds start packaging as soon as
      # this artifact exists, so the binaries it hashes must already be stored.
      # If a rerun finds a manifest already published, this upload fails rather
      # than replace hashes the builds may have embedded.
      - name: Upload TUI manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tui-manifest
          path: resources/tui/manifest.json
          if-no-files-found: error
