name: CI

on:
  pull_request:
    branches: [master, poracode/v2, poracode/v4-integration]
  push:
    branches: [master, poracode/v2, poracode/v4-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI checkouts do not benefit from the worktree-oriented global virtual
  # store, and native setup must operate on checkout-local packages.
  BUN_INSTALL_GLOBAL_STORE: "0"

jobs:
  changes:
    name: Classify PR changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.scope.outputs.core }}
    steps:
      - name: Checkout complete history for PR diff
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Classify affected CI surfaces
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-change-scope.mjs

  typecheck:
    name: Typecheck
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts && node node_modules/bun/install.js

      - name: Generate Codex protocol types
        run: bun run codex-protocol:gen

      - name: Typecheck
        run: bun run typecheck

  lint:
    name: Lint
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts && node node_modules/bun/install.js

      - name: Lint
        run: bun run lint

      - name: Release version regression tests
        run: node --test scripts/resolve-release-version.test.mjs

      - name: Desktop packaging regression tests
        run: node --test scripts/build-desktop-artifact.test.mjs scripts/mac-notarization-dependency.test.mjs

      - name: Electron development regression tests
        run: node --test scripts/dev-runtime-watch.test.mjs scripts/dev-launch.test.mjs

      - name: Architecture boundary audit and analyzer tests
        run: bun run architecture:check

      - name: Managed smoke harness regression tests
        run: |
          node --test .agents/skills/interactive-testing/scripts/*.test.mjs
          bun run vitest run --config tests/native-e2e/vitest.config.ts helpers/managedAppSession.test.ts

      # Protocol changes classify as core, so the operation map's
      # manifestHash lock over the generated inventory runs in core CI too:
      # a regenerated protocol/remote/v3/generated/inventory.json without a
      # refreshed tests/native-e2e/harness/operation-map.json fails here
      # (cheap single-file lock) instead of only in the native foundation job.
      - name: Protocol inventory operation-map lock
        run: bun run vitest run --config tests/native-e2e/vitest.config.ts operationMap.test.ts

      - name: Nightly qualification regression tests
        run: node --test scripts/ci-server-artifact-meta.test.mjs scripts/qualification-http.test.mjs scripts/server-n1-qualification.test.mjs scripts/package-chrome-extension.test.mjs scripts/chrome-extension-worker.test.mjs scripts/ci-change-scope.test.mjs scripts/qualify-nightly-pwa.test.mjs scripts/nightly-pwa-workflows.test.mjs scripts/deploy-website-workflow.test.mjs scripts/native-ci-workflows.test.mjs scripts/qualify-release-pwa.test.mjs scripts/server-gate-workflows.test.mjs scripts/verify-server-tarball-contents.test.mjs scripts/prepare-server-native.test.mjs scripts/server-release-install.test.mjs scripts/runtime-closure.test.mjs scripts/generate-runtime-manifest.test.mjs scripts/set-release-version.test.mjs scripts/build-ssh-runtime-archive.test.mjs scripts/poracode-cli-qualification.test.mjs scripts/publish-npm-package.test.mjs packages/poracode-cli/test/launcher.test.mjs

      - name: Desktop CLI packaging and bootstrap regressions
        run: node --test scripts/prepare-desktop-cli.test.mjs

  tui:
    name: TUI
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts && node node_modules/bun/install.js

      - name: Install TUI dependencies
        run: bun run tui:install

      - name: Typecheck
        run: bun run tui:typecheck

      - name: Test
        run: bun run tui:test

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate GitHub Actions workflows
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts && node node_modules/bun/install.js

      - name: Format check
        run: bun run fmt:check

  web_build:
    name: Canonical web build
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts && node node_modules/bun/install.js

      - name: Generate Codex protocol types
        run: bun run codex-protocol:gen

      - name: Build canonical web client
        run: bun run build:web

      - name: Verify finalized web outputs
        run: |
          test -f dist/web/index.html
          test -f dist/web/manifest.webmanifest
          test -f dist/web/service-worker.js
          test -f dist/web/poracode-ssh-runtime/manifest.json
          test -f dist/web/poracode-ssh-runtime/runtime.bin

  runtime_deps:
    name: Runtime dependencies
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts && node node_modules/bun/install.js

      - name: Generate Codex protocol types
        run: bun run codex-protocol:gen

      - name: Build Electron bundles
        run: bun run build:electron

      - name: Validate packaged runtime dependencies
        run: node scripts/build-desktop-artifact.mjs --skip-build --check-runtime-deps

  rust_helper:
    name: Rust helper (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: native/computer-use-helper
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native/computer-use-helper

      - name: Install Linux integration-test tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes dbus-x11 xvfb

      - name: Install cargo-deny
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-deny

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test (Linux X11 and D-Bus)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run --auto-servernum cargo test --locked

      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --locked

      - name: Check documentation
        run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check dependencies
        if: runner.os == 'Linux'
        run: cargo deny check

  test_shard:
    name: Test shard (${{ matrix.shard }}/8)
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # Unit tests run via vitest in node/jsdom and never launch the Electron
    # runtime, so skip the flaky Chromium binary download and the root
    # postinstall, which validates native dependencies under Electron. SQLite
    # ships N-API prebuilds; only node-pty needs a Linux build below.
    # ELECTRON_OVERRIDE_DIST_PATH lets `require("electron")` resolve to a path
    # string without the binary present, so suites that import the module (but
    # never spawn it) load instead of throwing from electron/index.js.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      ELECTRON_OVERRIDE_DIST_PATH: node_modules/electron/dist
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts && node node_modules/bun/install.js

      - name: Build test native dependencies
        # Compile against setup-node's local headers; CI must not download the
        # same Node headers independently in every isolated test job.
        run: scripts/ci-rebuild-node-pty.sh

      - name: Test shard
        # The generated Swift/Kotlin compiler fixture belongs to the scoped
        # native-contract lane. Keeping it here made renderer-only PRs spend
        # most of their critical path compiling native fixtures.
        env:
          PORACODE_TEST_LANE: core
        run: bun run test --shard=${{ matrix.shard }}/8

  test_perf:
    name: Perf suites (uncontended)
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    # Absolute latency budgets are only meaningful on an unloaded runner, so
    # the perf suites are excluded from the sharded unit run and executed
    # here as their own invocation (vitest.perf.config.ts). The browser bench
    # stays opt-in locally: CI deliberately skips the Chromium download.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      ELECTRON_OVERRIDE_DIST_PATH: node_modules/electron/dist
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts && node node_modules/bun/install.js

      - name: Build test native dependencies
        # The perf runner exercises the supervisor's node-pty runtime chain.
        run: scripts/ci-rebuild-node-pty.sh

      - name: CLI hook perf suite
        run: bun run test:perf:cli-hook

      - name: Remote protocol perf suite
        run: bun run test:perf:remote

      - name: Project tree perf suite
        run: bun run test:perf:project-tree

  ci_gate:
    name: Test
    if: ${{ always() }}
    needs:
      [
        changes,
        typecheck,
        lint,
        fmt,
        tui,
        web_build,
        runtime_deps,
        rust_helper,
        test_shard,
        test_perf,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all core checks
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          CORE_REQUIRED: ${{ needs.changes.outputs.core }}
        run: |
          node - <<'NODE'
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          if (!["true", "false"].includes(process.env.CORE_REQUIRED)) throw new Error("core change scope is missing");
          const required = new Set(["changes", "fmt"]);
          if (process.env.CORE_REQUIRED === "true") {
            for (const name of ["typecheck", "lint", "tui", "web_build", "runtime_deps", "rust_helper", "test_shard", "test_perf"]) required.add(name);
          }
          for (const [name, job] of Object.entries(jobs)) {
            const expected = required.has(name) ? "success" : "skipped";
            if (job.result !== expected) throw new Error(`${name}: expected ${expected}, received ${job.result}`);
          }
          NODE
