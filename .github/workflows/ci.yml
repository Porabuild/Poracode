name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI checkouts do not benefit from the worktree-oriented global virtual
  # store, and targeted pnpm rebuilds must operate on checkout-local packages.
  PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE: "false"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Codex protocol types
        run: pnpm run codex-protocol:gen

      - name: Typecheck
        run: pnpm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format check
        run: pnpm run fmt:check

  rust_helper:
    name: Rust helper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: native/computer-use-helper
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/computer-use-helper

      - name: Install Linux integration-test tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes dbus-x11 xvfb

      - name: Install cargo-deny
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-deny

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test (Linux X11 and D-Bus)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run --auto-servernum cargo test --locked

      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --locked

      - name: Check documentation
        run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check dependencies
        if: runner.os == 'Linux'
        run: cargo deny check

  test_shard:
    name: Test shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Unit tests run via vitest in node/jsdom and never launch the Electron
    # runtime, so skip the flaky Chromium binary download and the root
    # postinstall, which rebuilds better-sqlite3 for Electron. The database
    # tests need Node-ABI better-sqlite3 and node-pty bindings rebuilt below.
    # ELECTRON_OVERRIDE_DIST_PATH lets `require("electron")` resolve to a path
    # string without the binary present, so suites that import the module (but
    # never spawn it) load instead of throwing from electron/index.js.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      ELECTRON_OVERRIDE_DIST_PATH: node_modules/electron/dist
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build test native dependencies
        # node-pty ships no Linux prebuild, so every shard compiles it from
        # source and downloads Node headers from nodejs.org. A flaky transfer
        # crashes node-gyp's downloader (undici assert(!this.paused)) instead
        # of failing cleanly, so retry the rebuild like other network steps.
        run: |
          for attempt in 1 2 3; do
            if pnpm rebuild better-sqlite3 node-pty; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Native dependency rebuild failed after $attempt attempts."
              exit 1
            fi
            echo "::warning::Native dependency rebuild attempt $attempt failed; retrying."
            sleep $((attempt * 10))
          done
        shell: bash

      - name: Test shard
        run: pnpm run test --shard=${{ matrix.shard }}/4

  test:
    name: Test
    if: ${{ always() }}
    needs: test_shard
    runs-on: ubuntu-latest
    steps:
      - name: Verify test shards
        run: test "${{ needs.test_shard.result }}" = "success"
