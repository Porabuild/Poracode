name: CI

on:
  pull_request:
    branches: [master, poracode/v2, poracode/v4-integration]
  push:
    branches: [master, poracode/v2, poracode/v4-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI checkouts do not benefit from the worktree-oriented global virtual
  # store, and targeted pnpm rebuilds must operate on checkout-local packages.
  PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE: "false"

jobs:
  changes:
    name: Classify PR changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.scope.outputs.core }}
    steps:
      - name: Checkout complete history for PR diff
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Classify affected CI surfaces
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-change-scope.mjs

  typecheck:
    name: Typecheck
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Codex protocol types
        run: pnpm run codex-protocol:gen

      - name: Typecheck
        run: pnpm run typecheck

  lint:
    name: Lint
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

      - name: Release version regression tests
        run: node --test scripts/resolve-release-version.test.mjs

      - name: Architecture boundary audit and analyzer tests
        run: pnpm run architecture:check

      - name: Managed smoke harness regression tests
        run: |
          node --test .agents/skills/interactive-testing/scripts/*.test.mjs
          pnpm exec vitest run --config tests/native-e2e/vitest.config.ts helpers/managedAppSession.test.ts

      - name: Nightly qualification regression tests
        run: node --test scripts/ci-change-scope.test.mjs scripts/qualify-nightly-pwa.test.mjs scripts/nightly-pwa-workflows.test.mjs scripts/native-ci-workflows.test.mjs scripts/qualify-release-pwa.test.mjs scripts/server-gate-workflows.test.mjs scripts/verify-server-tarball-contents.test.mjs scripts/prepare-server-native.test.mjs scripts/server-release-install.test.mjs scripts/runtime-closure.test.mjs scripts/generate-runtime-manifest.test.mjs scripts/set-release-version.test.mjs scripts/build-ssh-runtime-archive.test.mjs scripts/poracode-cli-qualification.test.mjs scripts/publish-npm-package.test.mjs packages/poracode-cli/test/launcher.test.mjs

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format check
        run: pnpm run fmt:check

  web_build:
    name: Canonical web build
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Codex protocol types
        run: pnpm run codex-protocol:gen

      - name: Build canonical web client
        run: pnpm run build:web

      - name: Verify finalized web outputs
        run: |
          test -f dist/web/index.html
          test -f dist/web/manifest.webmanifest
          test -f dist/web/service-worker.js
          test -f dist/web/poracode-ssh-runtime/manifest.json
          test -f dist/web/poracode-ssh-runtime/runtime.bin

  runtime_deps:
    name: Runtime dependencies
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Codex protocol types
        run: pnpm run codex-protocol:gen

      - name: Build Electron bundles
        run: pnpm run build:electron

      - name: Validate packaged runtime dependencies
        run: node scripts/build-desktop-artifact.mjs --skip-build --check-runtime-deps

  rust_helper:
    name: Rust helper (${{ matrix.os }})
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: native/computer-use-helper
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native/computer-use-helper

      - name: Install Linux integration-test tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes dbus-x11 xvfb

      - name: Install cargo-deny
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-deny

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test (Linux X11 and D-Bus)
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run --auto-servernum cargo test --locked

      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --locked

      - name: Check documentation
        run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check dependencies
        if: runner.os == 'Linux'
        run: cargo deny check

  test_shard:
    name: Test shard (${{ matrix.shard }}/8)
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # Unit tests run via vitest in node/jsdom and never launch the Electron
    # runtime, so skip the flaky Chromium binary download and the root
    # postinstall, which validates native dependencies under Electron. SQLite
    # ships N-API prebuilds; only node-pty needs a Linux build below.
    # ELECTRON_OVERRIDE_DIST_PATH lets `require("electron")` resolve to a path
    # string without the binary present, so suites that import the module (but
    # never spawn it) load instead of throwing from electron/index.js.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      ELECTRON_OVERRIDE_DIST_PATH: node_modules/electron/dist
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build test native dependencies
        # Compile against setup-node's local headers; CI must not download the
        # same Node headers independently in every isolated test job.
        run: scripts/ci-rebuild-node-pty.sh

      - name: Test shard
        run: pnpm run test --shard=${{ matrix.shard }}/8

  test_perf:
    name: Perf suites (uncontended)
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    # Absolute latency budgets are only meaningful on an unloaded runner, so
    # the perf suites are excluded from the sharded unit run and executed
    # here as their own invocation (vitest.perf.config.ts). The browser bench
    # stays opt-in locally: CI deliberately skips the Chromium download.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      ELECTRON_OVERRIDE_DIST_PATH: node_modules/electron/dist
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build test native dependencies
        # The perf runner exercises the supervisor's node-pty runtime chain.
        run: scripts/ci-rebuild-node-pty.sh

      - name: CLI hook perf suite
        run: pnpm run test:perf:cli-hook

      - name: Remote protocol perf suite
        run: pnpm run test:perf:remote

  ci_gate:
    name: CI required gate
    if: ${{ always() }}
    needs:
      [changes, typecheck, lint, fmt, web_build, runtime_deps, rust_helper, test_shard, test_perf]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all core checks
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          CORE_REQUIRED: ${{ needs.changes.outputs.core }}
        run: |
          node - <<'NODE'
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          if (!["true", "false"].includes(process.env.CORE_REQUIRED)) throw new Error("core change scope is missing");
          const required = new Set(["changes", "fmt"]);
          if (process.env.CORE_REQUIRED === "true") {
            for (const name of ["typecheck", "lint", "web_build", "runtime_deps", "rust_helper", "test_shard", "test_perf"]) required.add(name);
          }
          for (const [name, job] of Object.entries(jobs)) {
            const expected = required.has(name) ? "success" : "skipped";
            if (job.result !== expected) throw new Error(`${name}: expected ${expected}, received ${job.result}`);
          }
          NODE
