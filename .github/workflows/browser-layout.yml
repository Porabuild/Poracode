name: Browser layout tests

# Real-Chromium layout tests for the chat transcript (`bun run test:browser`),
# because jsdom has no layout engine. It is deliberately its own workflow and
# not a required check until it has a track record, so a failure can't fail CI
# or block the nightly PWA, which deploys only after a successful CI run.
on:
  pull_request:
    branches: [master, poracode/v2, poracode/v4-integration]
    paths:
      - "src/renderer/**"
      - "vitest.browser.config.ts"
      - "package.json"
      - "bun.lock"
      - "patches/**"
      - ".github/actions/setup-bun/**"
      - ".github/workflows/browser-layout.yml"
  push:
    branches: [master]
    paths:
      - "src/renderer/**"
      - "vitest.browser.config.ts"
      - "package.json"
      - "bun.lock"
      - "patches/**"
      - ".github/actions/setup-bun/**"
      - ".github/workflows/browser-layout.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser_layout:
    name: Browser layout tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts && node node_modules/bun/install.js

      - name: Prepare Ubuntu package mirrors
        run: |
          if ! getent hosts azure.archive.ubuntu.com > /dev/null; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          for host in archive.ubuntu.com security.ubuntu.com; do
            if ! getent hosts "$host" > /dev/null; then
              response="$(curl -fsS --max-time 15 --resolve cloudflare-dns.com:443:1.1.1.1 -H 'accept: application/dns-json' "https://cloudflare-dns.com/dns-query?name=$host&type=A")"
              ip="$(jq -er '[.Answer[]? | select(.type == 1) | .data | select(test("^[0-9]{1,3}(\\.[0-9]{1,3}){3}$"))] | first' <<< "$response")"
              printf '%s %s\n' "$ip" "$host" | sudo tee -a /etc/hosts > /dev/null
            fi
          done

      - name: Install Chromium for Playwright
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Real-layout transcript tests
        run: bun run test:browser
