name: Release (nightly)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — skip tag push and build (for testing)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-nightly
  cancel-in-progress: false

jobs:
  # ── Step 1: Read master version and compute timestamped release ──
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      base_version: ${{ steps.resolve.outputs.base_version }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}

    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Resolve nightly version
        id: resolve
        run: |
          BASE=$(node -p "require('./package.json').version")
          if ! echo "$BASE" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::master's package.json version must be plain X.Y.Z (got '$BASE'). The previous stable release likely failed to push the patch bump."
            exit 1
          fi
          TIMESTAMP=$(date -u +%Y%m%d%H%M)
          VERSION="${BASE}-nightly.${TIMESTAMP}"
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists (try again in a minute)."
            exit 1
          fi
          echo "base_version=$BASE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Resolved nightly tag: $TAG"

  # ── Step 2: Build installers for each platform ───────────────────
  build:
    needs: prepare
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/_build.yml
    with:
      ref: ${{ needs.prepare.outputs.source_ref }}
      version: ${{ needs.prepare.outputs.version }}
      channel: nightly
      sentry_environment: nightly
    secrets:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  # ── Step 3: Create GitHub prerelease ─────────────────────────────
  release:
    needs: [prepare, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/release-assets
          pattern: dist-*
          merge-multiple: true

      - name: List release assets
        run: ls -lh "${{ runner.temp }}/release-assets"

      - name: Generate release notes since previous nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_REF: ${{ needs.prepare.outputs.source_ref }}
        run: |
          previous_tag=$(gh release list --repo "${{ github.repository }}" --json tagName,isPrerelease,createdAt --limit 1000 \
            --jq '[.[] | select(.isPrerelease and .tagName != env.CURRENT_TAG and (.tagName | test("-nightly\\.")))] | sort_by(.createdAt) | last | .tagName // empty')

          args=(-f "tag_name=$CURRENT_TAG" -f "target_commitish=$SOURCE_REF")
          if [ -n "$previous_tag" ]; then
            echo "Generating release notes since $previous_tag"
            args+=(-f "previous_tag_name=$previous_tag")
          else
            echo "No previous nightly release found; generating default release notes."
          fi

          gh api repos/${{ github.repository }}/releases/generate-notes "${args[@]}" \
            --jq .body > "$RUNNER_TEMP/release-notes.md"

      # electron-updater treats bare semver tags in GitHub's releases.atom feed
      # as releases. Stage the commit under a deliberately non-semver tag while
      # the draft assets upload, then create the final tag only when the complete
      # release is published below.
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Create release commit and staging tag
        id: stage_release
        env:
          DRAFT_TAG: release-draft-${{ github.run_id }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = process.env.RELEASE_VERSION;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "release: ${{ needs.prepare.outputs.tag }}"
          echo "release_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git tag "$DRAFT_TAG"
          git push origin "$DRAFT_TAG"

      # Upload every asset to a draft associated with the non-semver staging tag.
      # Clients ignore that tag, and the final semver tag does not exist yet.
      - name: Create GitHub prerelease (draft)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: release-draft-${{ github.run_id }}
          name: Poracode Nightly ${{ needs.prepare.outputs.tag }}
          prerelease: true
          draft: true
          make_latest: false
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rename the draft to the final tag and publish it in one API update. The
      # final tag and complete release therefore become visible together.
      - name: Publish release atomically
        env:
          DRAFT_TAG: release-draft-${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_COMMIT: ${{ steps.stage_release.outputs.release_commit }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          release_id=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$DRAFT_TAG\") | .id")
          if [ -z "$release_id" ]; then
            echo "::error::Draft release for $DRAFT_TAG was not found."
            exit 1
          fi
          gh api --method PATCH "repos/${{ github.repository }}/releases/$release_id" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$RELEASE_COMMIT" \
            -F draft=false \
            -F prerelease=true \
            -f make_latest=false
          gh api --method DELETE \
            "repos/${{ github.repository }}/git/refs/tags/$DRAFT_TAG" ||
            echo "::warning::Published successfully but could not delete staging tag $DRAFT_TAG."

  cleanup-failed-release:
    needs: [prepare, build, release]
    if: ${{ always() && !inputs.dry_run && (needs.release.result == 'failure' || needs.release.result == 'cancelled') }}
    runs-on: ubuntu-latest

    steps:
      - name: Remove failed release and tag
        env:
          DRAFT_TAG: release-draft-${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release delete "$DRAFT_TAG" \
            --repo "${{ github.repository }}" \
            --cleanup-tag --yes 2>/dev/null || true
          gh release delete "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --cleanup-tag --yes 2>/dev/null || true
          if gh api "repos/${{ github.repository }}/git/ref/tags/$DRAFT_TAG" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${{ github.repository }}/git/refs/tags/$DRAFT_TAG"
          fi
          if gh api "repos/${{ github.repository }}/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${{ github.repository }}/git/refs/tags/$RELEASE_TAG"
          fi
