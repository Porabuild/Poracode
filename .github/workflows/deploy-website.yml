name: Deploy Website

# Vercel Git deployments are disabled in website/vercel.json. Deploy the
# production website only when its source or workspace dependencies change.
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-website.yml"
      - ".vercelignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website-master
  cancel-in-progress: false

jobs:
  web:
    name: Website (Vercel)
    runs-on: ubuntu-latest
    environment: mobile-web
    env:
      # pnpm 12 ignores the legacy global-store install override. Keep every
      # install and exec under Vercel on a project-local store so the traced
      # server files are included in the prebuilt deployment.
      PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE: "false"
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_LANDING_PROJECT_ID }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Validate Vercel configuration
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PORACODE_MOBILE_APPLE_TEAM_ID: ${{ secrets.PORACODE_MOBILE_APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
        run: |
          for name in \
            VERCEL_ORG_ID \
            VERCEL_PROJECT_ID \
            PORACODE_MOBILE_APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required landing-site configuration: $name" >&2
              exit 1
            fi
          done
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Missing mobile-web secret: VERCEL_TOKEN" >&2
            exit 1
          fi
      - name: Install Vercel CLI
        run: npm install --global vercel@59.10.0
      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        env:
          PORACODE_MOBILE_ANDROID_SHA256_CERT_FINGERPRINTS: ${{ secrets.PORACODE_MOBILE_ANDROID_SHA256_CERT_FINGERPRINTS }}
          PORACODE_MOBILE_APPLE_TEAM_ID: ${{ secrets.PORACODE_MOBILE_APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Verify native app-link association documents
        shell: bash
        env:
          CANONICAL_ORIGIN: https://poracode.com
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PORACODE_MOBILE_ANDROID_SHA256_CERT_FINGERPRINTS: ${{ secrets.PORACODE_MOBILE_ANDROID_SHA256_CERT_FINGERPRINTS }}
          PORACODE_MOBILE_APPLE_TEAM_ID: ${{ secrets.PORACODE_MOBILE_APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          fetch_document() {
            local url="$1" output="$2" origin_kind="$3"
            local curl_options=(--fail-with-body --silent --show-error --output "$output")
            if [ "$origin_kind" = deployment ]; then
              # The immutable URL is protected by Vercel SSO. Use the existing
              # deployment credentials; the canonical App Links origin below
              # must still be readable without authentication.
              vercel curl "$url" --token="$VERCEL_TOKEN" -- "${curl_options[@]}"
            else
              curl "$url" "${curl_options[@]}"
            fi
          }

          verify_documents() {
            local origin="$1"
            local suffix="$2"
            local label="$3"
            local assetlinks="$RUNNER_TEMP/assetlinks-$label.json"
            local association="$RUNNER_TEMP/apple-app-site-association-$label.json"

            fetch_document "$origin/.well-known/assetlinks.json$suffix" "$assetlinks" "$label"
            fetch_document "$origin/.well-known/apple-app-site-association$suffix" "$association" "$label"

            # An unconfigured Android release must publish no trusted signer.
            # Configured platforms must match the actual production identities.
            jq -e --arg fingerprints "$PORACODE_MOBILE_ANDROID_SHA256_CERT_FINGERPRINTS" '
              ($fingerprints | split("[\n,]"; "") |
                map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)) |
                map(ascii_upcase) | sort) as $expected |
              if ($expected | length) == 0 then
                . == []
              else
                length == 1 and
                .[0].relation == ["delegate_permission/common.handle_all_urls"] and
                .[0].target.namespace == "android_app" and
                .[0].target.package_name == "com.lightcodeapp.mobile" and
                (.[0].target.sha256_cert_fingerprints | map(ascii_upcase) | sort) == $expected and
                all(.[0].target.sha256_cert_fingerprints[];
                  test("^([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}$"))
              end
            ' "$assetlinks" >/dev/null || {
              echo "Android association verification failed at $origin" >&2
              return 1
            }
            jq -e --arg app_id "$PORACODE_MOBILE_APPLE_TEAM_ID.com.lightcodeapp.mobile" '
              (.applinks.details | length) == 1 and
              .applinks.details[0].appIDs == [$app_id] and
              (.applinks.details[0].components | map(.["/"]) | sort) ==
                (["/", "/pair*", "/app*"] | sort) and
              all(.applinks.details[0].components[]; .exclude != true) and
              .webcredentials.apps == [$app_id]
            ' "$association" >/dev/null || {
              echo "iOS association verification failed at $origin" >&2
              return 1
            }
          }

          verify_documents "$DEPLOYMENT_URL" "" deployment
          # The immutable deployment URL alone does not prove that the canonical
          # App Links origin moved to this release. A query bypasses the previous
          # five-minute edge object while exercising the production alias.
          verify_documents "$CANONICAL_ORIGIN" "?release=$GITHUB_SHA" canonical
