name: Deploy Website

# Vercel Git deployments are disabled in website/vercel.json. Deploy the
# production website only when its source or workspace dependencies change.
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-website.yml"
      - ".vercelignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "website/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website-master
  cancel-in-progress: false

jobs:
  web:
    name: Website (Vercel)
    runs-on: ubuntu-latest
    environment: mobile-web
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_LANDING_PROJECT_ID }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm
      - name: Validate Vercel configuration
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing mobile-web variable: $name" >&2
              exit 1
            fi
          done
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Missing mobile-web secret: VERCEL_TOKEN" >&2
            exit 1
          fi
      - name: Install Vercel CLI
        run: npm install --global vercel@54.21.1
      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
