name: Native clients

on:
  workflow_call:
  pull_request:
    branches: [master, poracode/v2, poracode/v4-integration]
  push:
    branches: [master, poracode/v2, poracode/v4-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PNPM_CONFIG_ENABLE_GLOBAL_VIRTUAL_STORE: "false"

jobs:
  changes:
    name: Classify PR changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.scope.outputs.native_android }}
      ios: ${{ steps.scope.outputs.native_ios }}
      shared: ${{ steps.scope.outputs.native_shared }}
    steps:
      - name: Checkout complete history for PR diff
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Classify affected native surfaces
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-change-scope.mjs

  remote_v3_contract:
    name: Remote v3 generated artifacts
    needs: changes
    if: ${{ needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check committed remote-v3 bindings
        run: pnpm run protocol:remote:v3:check

      - name: Test the remote-v3 contract
        run: pnpm exec vitest run --configLoader runner protocol/remote/v3

      - name: Reject generated changes
        run: git diff --exit-code -- protocol/remote/v3/generated

  android:
    name: Android Compose build and tests
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Action default (`tools platform-tools`) no longer installs: the
          # legacy `tools` package was removed from the SDK repository, so
          # `sdkmanager tools` fails with "Failed to find package 'tools'".
          # Skip default packages; required SDK packages are installed
          # explicitly via sdkmanager in the steps below.
          packages: ""

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Require Android 17 with the Android 14 minimum
        run: |
          grep -Eq 'compileSdk = 37' android/app/build.gradle.kts
          grep -Eq 'targetSdk = 37' android/app/build.gradle.kts
          # Android 14 (API 34) is the oldest AOSP release still receiving
          # monthly security bulletins (September 2026 bulletin covers 14-17).
          grep -Eq 'minSdk = 34' android/app/build.gradle.kts

      - name: Test, assemble, and lint Android
        working-directory: android
        run: ./gradlew clean testDebugUnitTest assembleDebug lintDebug --no-daemon --stacktrace

      - name: Upload Android evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-native-ci-${{ github.run_attempt }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests/testDebugUnitTest/**
            android/app/build/reports/lint-results-debug.*
            android/app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7

  ios:
    name: iOS SwiftUI build and AppTests
    needs: changes
    if: ${{ needs.changes.outputs.ios == 'true' }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      IOS_DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"

      # App.xcodeproj currently has no packageReferences. Do not key a cache
      # from the unreferenced legacy Capacitor Package.resolved file.
      - name: Show Xcode toolchain
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = "26.6"
          test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "26.5"
          for target in App AppTests PoracodeActivities; do
            deployment_target="$(xcodebuild -project ios/App/App.xcodeproj -target "$target" \
              -showBuildSettings \
              | awk '/^[[:space:]]*IPHONEOS_DEPLOYMENT_TARGET = / { print $3; exit }')"
            awk -v version="$deployment_target" 'BEGIN { exit !(version + 0 >= 17) }'
          done

      - name: Run portable Swift contract suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/poracode-swift-contracts"
          for suite in PortForwarding BrowserMirror GitHubOperations AdvancedOperations; do
            swift test --package-path "ios/App/AppTests/$suite" \
              --scratch-path "$RUNNER_TEMP/poracode-swift-contracts/$suite" --jobs 2 \
              2>&1 | tee "$RUNNER_TEMP/poracode-swift-contracts/$suite.log"
          done

      - name: Build iOS tests for Simulator
        working-directory: ios/App
        run: |
          xcodebuild build-for-testing -quiet \
            -project App.xcodeproj \
            -scheme App \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/PoracodeDerivedData"

      - name: Run AppTests
        working-directory: ios/App
        run: |
          xcodebuild test-without-building -quiet \
            -project App.xcodeproj \
            -scheme App \
            -only-testing:AppTests \
            -destination "$IOS_DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/PoracodeDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/AppTests.xcresult" \
            -parallel-testing-enabled NO

      - name: Upload iOS test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-native-ci-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/AppTests.xcresult
            ${{ runner.temp }}/poracode-swift-contracts/*.log
          if-no-files-found: warn
          retention-days: 7

  ios_ui:
    name: iOS XCUITest wire-lab journey
    needs: [changes, ios]
    if: ${{ needs.changes.outputs.ios == 'true' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build test native dependencies
        # The mock journey is pure Node, but the E.2 real-peer leg below runs
        # the production host, whose PTY sessions need node-pty (install runs
        # with --ignore-scripts). Retry like the foundation job.
        run: |
          for attempt in 1 2 3; do
            if pnpm rebuild node-pty; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Native dependency rebuild failed after $attempt attempts."
              exit 1
            fi
            echo "::warning::Native dependency rebuild attempt $attempt failed; retrying."
            sleep $((attempt * 10))
          done
        shell: bash

      - name: Build the production headless host
        # Required by the E.2 real-peer family journey: the real harness boots
        # dist/main/server.cjs with the strict checkout-shape layout.
        run: |
          pnpm run codex-protocol:gen
          pnpm run build:electron
          pnpm run prepare:server-native
          pnpm run prepare:package-assets
          test -f dist/main/server.cjs
          test -f dist/server-native/better_sqlite3.node
          test -d resources/wsl-helpers

      - name: Select Xcode 26.6
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"

      - name: Show Xcode toolchain
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = "26.6"

      # scripts/native-e2e.mjs creates the fixed "Poracode Native E2E"
      # simulator on this exact runtime (the iOS analogue of the Android
      # `poracode-pixel9-api37` convention). Fail with a clear message when
      # the runner image drops it instead of a confusing simctl create error.
      - name: Require the iOS 26.5 simulator runtime
        run: |
          xcrun simctl list runtimes
          xcrun simctl list runtimes -j | grep -q 'com.apple.CoreSimulator.SimRuntime.iOS-26-5'

      # The mock leg drives the mock wire-lab harness (pure Node: no headless
      # host needed by the journey itself). It starts the harness, builds the
      # NativeE2ETests UI runner for the fixed simulator, injects the control
      # URL/capability through a generated xctestrun file, runs the full
      # NativeJourneyUITests + NativeFamilyJourneyUITests set, and prunes its
      # own per-run artifacts. This stays the fast path.
      - name: Run the iOS XCUITest wire-lab journey (mock peer)
        env:
          # Slot 1 like scripts/ci-android-api37.sh: slot 0's base port
          # (49152) is claimed by macOS system services on runner images.
          PORACODE_NATIVE_E2E_SLOT: "1"
          NATIVE_E2E_STARTUP_TIMEOUT_MS: "60000"
          # Includes clean build-for-testing time before XCUITest starts. The
          # previous five-minute floor expired during a 12-minute CI compile
          # and deliberately stopped the control server under every test.
          NATIVE_E2E_TEST_TIMEOUT_MS: "1800000"
        run: node scripts/native-e2e.mjs ios-ui

      # E.2 real-peer leg: the same journey against the production headless
      # host built above, scoped (-only-testing) to the two families with
      # real-mode branches — terminal keystroke (real PTY) and git (real repo
      # index). The steer/permission families self-skip in real mode. The
      # supervisor starts the real harness, reads its minted pairing
      # credential (never a workflow env var), and injects peerMode/pairing/
      # control into the 0o600 xctestrun file.
      - name: Run the iOS real-peer family journey (real host)
        env:
          PORACODE_NATIVE_E2E_SLOT: "1"
          NATIVE_E2E_PEER_MODE: "real"
          NATIVE_E2E_STARTUP_TIMEOUT_MS: "120000"
          NATIVE_E2E_TEST_TIMEOUT_MS: "1800000"
          NATIVE_E2E_IOS_ONLY_TESTING: "NativeE2ETests/NativeFamilyJourneyUITests/testTerminalKeystrokeFamilyWritesToPty,NativeE2ETests/NativeFamilyJourneyUITests/testGitFamilyStagesFromWorkspace"
        run: node scripts/native-e2e.mjs ios-ui

      - name: Upload iOS journey evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-ui-journey-${{ github.run_attempt }}
          path: .tmp/native-e2e/ios-ui-*/
          if-no-files-found: warn
          retention-days: 7

  android_api37_runtime:
    name: Android 17 emulator runtime
    needs: [changes, android]
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install native harness dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build test native dependencies
        # The E.2 real-peer leg below boots the production host, whose PTY
        # sessions need node-pty (install runs with --ignore-scripts). Retry
        # like the foundation job.
        run: |
          for attempt in 1 2 3; do
            if pnpm rebuild node-pty; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Native dependency rebuild failed after $attempt attempts."
              exit 1
            fi
            echo "::warning::Native dependency rebuild attempt $attempt failed; retrying."
            sleep $((attempt * 10))
          done
        shell: bash

      - name: Build the production headless host
        # Required by the E.2 real-peer family journey (native-e2e.mjs
        # android-real): the real harness boots dist/main/server.cjs with the
        # strict checkout-shape layout. Built before the emulator boots so
        # emulator minutes are spent on tests.
        run: |
          pnpm run codex-protocol:gen
          pnpm run build:electron
          pnpm run prepare:server-native
          pnpm run prepare:package-assets
          test -f dist/main/server.cjs
          test -f dist/server-native/better_sqlite3.node
          test -d resources/wsl-helpers

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Action default (`tools platform-tools`) no longer installs: the
          # legacy `tools` package was removed from the SDK repository, so
          # `sdkmanager tools` fails with "Failed to find package 'tools'".
          # Skip default packages; required SDK packages are installed
          # explicitly via sdkmanager in the steps below.
          packages: ""

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install Android 17 SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build Android runtime APKs before boot
        working-directory: android
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Pre-create the API 37 AVD with a fallback device profile
        # The runner's system-image package occasionally drops device profiles
        # (seen persistently with pixel_9 since 2026-09-12): avdmanager then
        # fails with "No device found matching --device pixel_9" and the boot
        # dies on "5554: Connection refused". Create the AVD ourselves against
        # the first profile the installed image actually ships; the emulator
        # runner below reuses it (force-avd-creation: false).
        run: |
          # Match the emulator action's SDK installer, which resets this path.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sdkmanager "system-images;android-37.0;google_apis;x86_64" > /dev/null
          avdmanager list device | sed -n 's/^id: \([0-9]*\) or "\(.*\)"$/\2/p' | grep -i '^pixel' | head -20 || true
          for device in pixel_9 pixel_9_pro pixel_9_pro_xl pixel_8 pixel_7 pixel_6 pixel; do
            if echo no | avdmanager create avd \
              -n poracode-pixel9-api37 \
              -k "system-images;android-37.0;google_apis;x86_64" \
              --device "$device"; then
              echo "Created poracode-pixel9-api37 with device profile: $device"
              exit 0
            fi
          done
          echo "::error::No usable device profile in the installed API 37 system image."
          exit 1

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android 17, install, launch, and run required instrumentation
        uses: ReactiveCircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: "37.0"
          target: google_apis
          arch: x86_64
          avd-name: poracode-pixel9-api37
          force-avd-creation: false
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          # Leave room for the APK, test APK, and API 37 package-install staging.
          disk-size: 6G
          # API 37's mapper requires read-color-buffer DMA. The host advertises
          # it only with both direct memory and the shared-slot allocator enabled.
          emulator-options: -no-window -gpu software -feature GLDirectMem,HasSharedSlotsHostMemoryAllocator -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          # The action runs every script line in a separate shell.
          script: bash ../scripts/ci-android-api37.sh

      # E.2 real-peer leg: a second emulator session driving the family class
      # against the production headless host built above (kept out of the mock
      # leg's script so the mock journeys stay the fast path and the mock
      # sandbox pin keeps its single-line script). native-e2e.mjs android-real
      # starts the real host harness, reads its minted pairing credential,
      # adb-reverses the harness control + production ports into the emulator
      # (the device dials the pairing URL's 127.0.0.1 endpoint through the
      # reverse; the production Host gate admits the loopback literal on its
      # own bound port), and runs Android37WireLabFamilyInstrumentedTest with
      # peerMode=real: the terminal-keystroke family (real PTY) and the git
      # family (real repo index); steer/permission self-skip in real mode.
      - name: Boot Android 17 and run the real-peer family journey
        uses: ReactiveCircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: "37.0"
          target: google_apis
          arch: x86_64
          avd-name: poracode-pixel9-api37
          force-avd-creation: false
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6G
          emulator-options: -no-window -gpu software -feature GLDirectMem,HasSharedSlotsHostMemoryAllocator -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          script: node ../scripts/native-e2e.mjs android-real

      - name: Upload Android 17 runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-api37-runtime-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/android-api37-launch.txt
            ${{ runner.temp }}/android-api37-logcat.txt
            ${{ runner.temp }}/android-wire-lab.stderr
            ${{ runner.temp }}/android-real-host.stdout
            ${{ runner.temp }}/android-real-host.stderr
            android/app/build/outputs/androidTest-results/**
            android/app/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 7

  android_api34_runtime:
    name: Android 14 minimum-supported runtime
    needs: [changes, android]
    if: ${{ needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Action default (`tools platform-tools`) no longer installs: the
          # legacy `tools` package was removed from the SDK repository, so
          # `sdkmanager tools` fails with "Failed to find package 'tools'".
          # Skip default packages; required SDK packages are installed
          # explicitly via sdkmanager in the steps below.
          packages: ""

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android 14 and run the minimum-supported runtime tests
        uses: ReactiveCircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: poracode-pixel2-api34
          cores: 2
          # The API 34 system image, the Gradle daemon, and the test APK share
          # the runner; the API 26 image fit in 2048M, Android 14 needs more.
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: android
          script: |
            test "$(adb shell getprop ro.build.version.release | tr -d '\r')" = "14"
            test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "34"
            test "$(adb shell getprop ro.build.version.codename | tr -d '\r')" = "REL"
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.poracode.app.MinimumSdkLaunchInstrumentedTest,com.poracode.app.transport.TlsPinPairingInstrumentedTest --no-daemon --stacktrace
            printf '%s\n' '### Android 14 minimum-supported runtime evidence' '' '- API 34 emulator booted as Android 14 (REL).' '- The minSdk 34 APK launched and exposed the pairing entry point.' '- The minimum-SDK launch and TLS pin pairing tests passed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android 14 minimum-supported runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-api34-runtime-${{ github.run_attempt }}
          path: |
            android/app/build/outputs/androidTest-results/**
            android/app/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 7

  native_e2e_foundation:
    name: Native wire and real-host foundation
    needs: [changes, remote_v3_contract]
    if: ${{ needs.changes.outputs.shared == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build test native dependencies
        # node-pty ships no Linux prebuild, so the plain-node headless host
        # used by the foundation smoke compiles it from source (the install
        # step above runs with --ignore-scripts). Retry the rebuild like
        # ci.yml shards: node-gyp's Node-header download fails uncleanly on
        # flaky transfers.
        run: |
          for attempt in 1 2 3; do
            if pnpm rebuild node-pty; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Native dependency rebuild failed after $attempt attempts."
              exit 1
            fi
            echo "::warning::Native dependency rebuild attempt $attempt failed; retrying."
            sleep $((attempt * 10))
          done
        shell: bash

      - name: Build the production headless host
        run: |
          pnpm run codex-protocol:gen
          pnpm run build:electron
          pnpm run prepare:server-native
          # The server resolves its checkout-shape layout strictly
          # (docs/STANDALONE_SERVER.md §1/§2.1): resources/ must be prepared,
          # or startup refuses with ServerLayoutError instead of guessing.
          pnpm run prepare:package-assets
          test -f dist/main/server.cjs
          test -f dist/server-native/better_sqlite3.node
          test -d resources/wsl-helpers

      - name: Run native foundation and production-host smoke
        env:
          NATIVE_E2E_TEST_TIMEOUT_MS: "180000"
        run: |
          pnpm exec vitest run \
            --config tests/native-e2e/vitest.config.ts \
            --exclude='**/gitBurstQualification.test.ts' \
            --exclude='**/sharedHostLoadProfile.test.ts' \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit="$RUNNER_TEMP/native-e2e-junit.xml"

      # These production-host stress suites each saturate the runner. They were
      # unstable inside the broad 76-file process even after file serialization,
      # while a fresh dedicated process removes accumulated suite state. Keep
      # the rest of the suite parallel and isolate only this measured
      # resource-heavy pair; the n64 cell has its own hosted-runner allowance.
      - name: Run isolated native load qualifications
        env:
          # Git burst n64 consistently finishes its cell near the old 360s
          # Vitest ceiling on hosted Linux. Give evidence finalization room;
          # the job-level timeout still bounds the complete qualification.
          GIT_BURST_N64_TIMEOUT_MS: "600000"
        run: |
          pnpm exec vitest run \
            --config tests/native-e2e/vitest.config.ts \
            gitBurstQualification.test.ts \
            sharedHostLoadProfile.test.ts \
            --no-file-parallelism \
            --reporter=default \
            --reporter=junit \
            --outputFile.junit="$RUNNER_TEMP/native-load-junit.xml"

      - name: Require real production-host evidence
        # The vitest step above runs against the server built two steps ago
        # (dist/main/server.cjs exists before `detectHeadlessServerEntrypoint`
        # probes it), so both real-host suites must be present and NON-SKIPPED
        # in the junit output: the wire-smoke walk and the E.2
        # observable-effects family (real PTY echo + real git index). A skip
        # here means the artifact quietly went missing — fail the gate.
        run: |
          test -f "$RUNNER_TEMP/native-e2e-junit.xml"
          node -e '
            const fs = require("node:fs");
            const xml = fs.readFileSync(process.env.RUNNER_TEMP + "/native-e2e-junit.xml", "utf8");
            const expected = "starts the built headless host and walks environment/pair/token/ticket/socket";
            if (!xml.includes(expected)) throw new Error("real-host testcase missing");
            const suite = xml.match(/<testsuite name="realHost\.smoke\.test\.ts"[^>]*>/)?.[0];
            if (!suite) throw new Error("real-host testsuite missing");
            const attrs = Object.fromEntries(
              [...suite.matchAll(/([A-Za-z]+)="([^"]*)"/g)].map((match) => [match[1], match[2]]),
            );
            if (Number(attrs.tests) < 2 || attrs.skipped !== "0" || attrs.failures !== "0" || attrs.errors !== "0") {
              throw new Error(`real-host suite did not run cleanly: ${suite}`);
            }
            const effects = xml.match(/<testsuite name="realHostObservableEffects\.test\.ts"[^>]*>/)?.[0];
            if (!effects) throw new Error("real-host observable-effects testsuite missing");
            const effectsAttrs = Object.fromEntries(
              [...effects.matchAll(/([A-Za-z]+)="([^"]*)"/g)].map((match) => [match[1], match[2]]),
            );
            if (Number(effectsAttrs.tests) < 1 || effectsAttrs.skipped !== "0" || effectsAttrs.failures !== "0" || effectsAttrs.errors !== "0") {
              throw new Error(`real-host observable-effects suite did not run non-skipped: ${effects}`);
            }
          '

      - name: Upload native E2E evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-e2e-foundation-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-e2e-junit.xml
            ${{ runner.temp }}/native-load-junit.xml
          if-no-files-found: warn
          retention-days: 7

  server_install_qualification:
    name: Server install qualification
    needs: [changes, remote_v3_contract]
    if: ${{ needs.changes.outputs.shared == 'true' }}
    # Plan D3: qualification runs the one reusable artifact workflow, on the
    # exact bytes the release job promotes (release.yml calls the same file).
    uses: ./.github/workflows/_server-artifact.yml
    with:
      ref: ${{ github.sha }}
      artifact_name: poracode-server-artifact
  native_gate:
    name: Native required gate
    if: ${{ always() }}
    needs:
      - changes
      - remote_v3_contract
      - android
      - android_api34_runtime
      - android_api37_runtime
      - ios
      - ios_ui
      - native_e2e_foundation
      - server_install_qualification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require native build evidence
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          ANDROID_REQUIRED: ${{ needs.changes.outputs.android }}
          IOS_REQUIRED: ${{ needs.changes.outputs.ios }}
          SHARED_REQUIRED: ${{ needs.changes.outputs.shared }}
        run: |
          node - <<'NODE'
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          for (const name of ["ANDROID_REQUIRED", "IOS_REQUIRED", "SHARED_REQUIRED"]) {
            if (!["true", "false"].includes(process.env[name])) throw new Error(`${name} change scope is missing`);
          }
          const expected = {
            changes: true,
            remote_v3_contract: process.env.SHARED_REQUIRED === "true",
            android: process.env.ANDROID_REQUIRED === "true",
            android_api34_runtime: process.env.ANDROID_REQUIRED === "true",
            android_api37_runtime: process.env.ANDROID_REQUIRED === "true",
            ios: process.env.IOS_REQUIRED === "true",
            ios_ui: process.env.IOS_REQUIRED === "true",
            native_e2e_foundation: process.env.SHARED_REQUIRED === "true",
            server_install_qualification: process.env.SHARED_REQUIRED === "true",
          };
          for (const [name, required] of Object.entries(expected)) {
            const result = jobs[name]?.result;
            const wanted = required ? "success" : "skipped";
            if (result !== wanted) throw new Error(`${name}: expected ${wanted}, received ${result}`);
          }
          NODE
