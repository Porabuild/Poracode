name: Quality KPIs

# Weekly engineering-quality report in the job summary: fix-PR ratio, areas
# that keep needing fixes, and red/verdict rates of the default-branch gates.
on:
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  report:
    name: Quality KPI report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          sparse-checkout: scripts

      - name: Report the last two weeks
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/quality-kpis.mjs --days 14 --repo "$GITHUB_REPOSITORY"
